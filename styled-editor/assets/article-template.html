<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <!--
    styled-editor 固定输出模板
    规则：样式和结构一个字都不许改，只替换下面的占位符。

    占位符（双花括号，全部大写）：
      {{TITLE}}            文章标题
      {{DATE}}             日期，格式：2025-01-20
      {{WORD_COUNT}}       正文字数
      {{READ_MINUTES}}     预计阅读分钟数 = 字数 ÷ 300，四舍五入
      {{ACCOUNT_NAME}}     公众号名 / 作者署名（固定值，由 .env 注入，键见 .env.example）
      {{FOOTER_SLOGAN}}    页脚一句话签名（固定值，由 .env 注入）
      {{ENDING_CTA}}       结尾互动块第二行的转发语（固定值，由 .env 注入）
      {{ENDING_QUESTION}}  结尾互动区的提问（取正文的结尾问题）
      {{COVER_IMAGE}}      封面图文件名，与 HTML 同目录（如 2025-01-20-daily-500-cover.png）
      {{BODY}}             正文 HTML，按下面的组块规则拼装

    正文组块规则（每次都用同样的样式，直接复制）：
      普通段落  <p style="margin:0 0 24px;">……</p>
      小标题    <h2 style="margin:40px 0 20px;font-size:17px;line-height:1.5;font-weight:600;color:#1a1a1a;">……</h2>
      金句      <blockquote style="margin:32px 0;padding:2px 0 2px 14px;border-left:3px solid #d8c4a0;color:#9a7b4f;">……</blockquote>
      分隔符    <p style="margin:40px 0;text-align:center;color:#c8c8c8;letter-spacing:6px;font-size:14px;">· · ·</p>
      插图      <figure style="margin:32px 0;"><img src="文件名.png" alt="说明" style="display:block;width:100%;height:auto;border-radius:6px;"></figure>（可选，每 300-500 字一张，与封面同风格）
      原话引用  <blockquote style="margin:24px 0;padding:14px 18px;background:#f9f9f7;border-left:3px solid #b0b0b0;"><p style="margin:0 0 6px;font-size:12px;color:#a0a0a0;">出处名+原话</p><p style="margin:0;font-size:15px;color:#5a5a5a;line-height:1.7;">「引文」</p></blockquote>（转述他人观点时用，必须标出处；短句可在正文用「」并写明谁说的）

    发布方法：浏览器打开本文件 → 全选复制 → 粘贴进公众号编辑器，内联样式会保留。
    分隔符用法：正文超过 1200 字时，在约 1/3 和 2/3 处各放一个分隔符。
  -->
</head>
<body style="margin:0;padding:0;background:#f7f7f7;">
  <article style="max-width:677px;margin:0 auto;padding:32px 20px 24px;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:16px;color:#3f3f3f;line-height:1.75;letter-spacing:0.5px;">

    <header style="margin-bottom:32px;">
      <h1 style="margin:0 0 16px;font-size:22px;line-height:1.4;font-weight:600;color:#1a1a1a;text-align:center;">{{TITLE}}</h1>
      <p style="margin:0;font-size:13px;color:#999999;text-align:center;">{{DATE}} · {{WORD_COUNT}} 字 · 约 {{READ_MINUTES}} 分钟</p>
    </header>

    <figure style="margin:0 0 32px;">
      <img src="{{COVER_IMAGE}}" alt="{{TITLE}}" style="display:block;width:100%;height:auto;border-radius:6px;">
    </figure>

    {{BODY}}

    <section style="margin:40px 0 0;padding:20px;background:#f9f8f5;border-radius:6px;">
      <p style="margin:0 0 8px;font-size:15px;color:#5a5a5a;">{{ENDING_QUESTION}}</p>
      <p style="margin:0;font-size:13px;color:#999999;">{{ENDING_CTA}}</p>
    </section>

    <hr style="margin:36px 0 20px;border:none;border-top:1px solid #eeeeee;">
    <footer style="text-align:center;">
      <p style="margin:0 0 4px;font-size:14px;color:#666666;">{{ACCOUNT_NAME}}</p>
      <p style="margin:0;font-size:12px;color:#bbbbbb;">{{FOOTER_SLOGAN}}</p>
    </footer>

  </article>
</body>
</html>
